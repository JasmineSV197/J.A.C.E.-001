<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0a14">

  <title>Selené Vesperiine | J.A.C.E. 001</title>

  <link rel="stylesheet" href="style.css">

  <!-- Visual libraries. These do not provide AI question-answering. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://3dmol.org/build/3Dmol-min.js"></script>

  <script src="script.js" defer></script>

  <style>
    /* Embedded styles for integrated companion card & SVS emblem overlay */
    .companion-card {
      background: rgba(22, 17, 38, 0.75);
      border: 1px solid #3d2b56;
      border-radius: 16px;
      padding: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      text-align: center;
      margin: 0 auto;
    }

    .avatar-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #151026;
      border: 1px solid #3d2b56;
      margin-bottom: 12px;
    }

    .avatar-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .svs-dress-badge {
      position: absolute;
      top: 54%;
      left: 35%;
      width: 46px;
      height: 46px;
      pointer-events: none;
      z-index: 10;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9));
      animation: emblemGlow 4s infinite ease-in-out;
    }

    .svs-dress-badge svg {
      width: 100%;
      height: 100%;
    }

    @keyframes emblemGlow {
      0%, 100% {
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9)) brightness(1);
      }
      50% {
        filter: drop-shadow(0 0 10px rgba(229, 195, 150, 0.4)) brightness(1.25);
      }
    }

    .companion-info h2 {
      color: #b78be9;
      font-size: 1.3rem;
      margin-bottom: 4px;
    }

    .companion-info p {
      color: #a393bf;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <canvas id="bubbleCanvas" aria-hidden="true"></canvas>

  <div class="welcome-wrapper">

    <!-- HEADER -->
    <header class="system-header">

      <div class="system-title">
        Selené Vesperiine
      </div>

      <div class="header-actions">

        <label class="sr-only" for="languageSelect">
          Interface language
        </label>

        <select id="languageSelect">
          <option value="en">English (US)</option>
          <option value="es">Español</option>
          <option value="ja">日本語</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="ko">한국어</option>
        </select>

        <button
          id="toggleFxPanelBtn"
          class="fx-btn"
          type="button"
          aria-controls="fxPanel"
          aria-expanded="false"
        >
          ⚙️ FX Controls
        </button>

      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="welcome-container">

      <!-- AVATAR -->
      <section class="avatar-frame" aria-label="Selené avatar">

        <div class="status-indicator">
          SYSTEM ONLINE
        </div>

        <div class="avatar-viewport" id="avatarViewport">
          <!-- Integrated Companion Card & Overlay -->
          <div class="companion-card">
            <div class="avatar-wrapper">
              <img src="https://raw.githubusercontent.com/JasmineSV197/J.A.C.E.-001/main/selene.png" alt="Selené Vesperiine" class="avatar-img" />

              <div class="svs-dress-badge" title="Official SVS Emblem">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
                  <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#E5C396"/>
                      <stop offset="25%" stop-color="#9A6B3D"/>
                      <stop offset="50%" stop-color="#F2E2C2"/>
                      <stop offset="75%" stop-color="#805328"/>
                      <stop offset="100%" stop-color="#C5A475"/>
                    </linearGradient>

                    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
                      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
                    </filter>
                  </defs>

                  <g filter="url(#badgeShadow)">
                    <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
                    <circle cx="250" cy="250" r="238" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
                    <path d="M 250 39 C 120 39, 45 140, 45 250 C 45 360, 120 461, 250 461 C 145 440, 95 350, 95 250 C 95 150, 145 60, 250 39 Z" fill="url(#goldGrad)"/>
                    <text x="240" y="240" font-family="'Times New Roman', serif" font-size="210" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">S</text>
                    <text x="250" y="360" font-family="'Times New Roman', serif" font-size="170" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">V</text>
                    <text x="325" y="420" font-family="'Times New Roman', serif" font-size="180" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">S</text>
                  </g>
                </svg>
              </div>
            </div>

            <div class="companion-info">
              <h2>Selené Vesperiine</h2>
              <p>AI Companion • Identity & Specs Locked</p>
            </div>
          </div>
        </div>

      </section>

      <!-- GREETING -->
      <section class="greeting-box">

        <h1 id="welcomeGreeting">
          What can I help you with today?
        </h1>

        <div class="subtitle-bar" aria-live="polite">
          <span class="subtitle-text" id="subtitleOutput">
            "Hello. I am Selené. Select a specialized module to begin."
          </span>
        </div>

      </section>

      <!-- SPECIALIZED MODULES -->
      <section class="module-grid" aria-label="Specialized modules">

        <button
          class="module-card"
          type="button"
          data-domain="mathematics"
        >
          <span class="module-icon">∑</span>
          <span class="module-name">Mathematics</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="quantum"
        >
          <span class="module-icon">⚛</span>
          <span class="module-name">Quantum Computing</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="physics"
        >
          <span class="module-icon">⚡</span>
          <span class="module-name">Physics</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="chemistry"
        >
          <span class="module-icon">🧪</span>
          <span class="module-name">Chemistry</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="biology"
        >
          <span class="module-icon">🧬</span>
          <span class="module-name">Biology</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="history"
        >
          <span class="module-icon">🏛</span>
          <span class="module-name">History</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="psychology"
        >
          <span class="module-icon">🧠</span>
          <span class="module-name">Psychology</span>
        </button>

        <button
          class="module-card"
          type="button"
          data-domain="translation"
        >
          <span class="module-icon">🌐</span>
          <span class="module-name">Translation</span>
        </button>

      </section>

      <!-- SELECTED MODULE WORKSPACE -->
      <section
        id="activeDomainContainer"
        class="domain-view hidden"
        aria-label="Selected module workspace"
      ></section>

    </main>
  </div>

  <!-- EFFECT CONTROLS -->
  <aside
    id="fxPanel"
    class="fx-panel hidden"
    aria-label="Effect controls"
  >

    <h2>✨ Effect Controls</h2>

    <label for="bubbleCount">
      Bubble Density
      <output id="bubbleCountValue">50</output>
    </label>

    <input
      type="range"
      id="bubbleCount"
      min="10"
      max="150"
      value="50"
    >

    <label for="bubbleSpeed">
      Float Speed
      <output id="bubbleSpeedValue">3</output>
    </label>

    <input
      type="range"
      id="bubbleSpeed"
      min="1"
      max="10"
      value="3"
    >

    <label for="bubbleSize">
      Max Bubble Size
      <output id="bubbleSizeValue">15</output>
    </label>

    <input
      type="range"
      id="bubbleSize"
      min="5"
      max="40"
      value="15"
    >

    <label for="glowIntensity">
      Glow Intensity
      <output id="glowIntensityValue">25</output>
    </label>

    <input
      type="range"
      id="glowIntensity"
      min="0"
      max="50"
      value="25"
    >

    <button id="resetFxBtn" type="button">
      Reset Effects
    </button>

  </aside>

</body>
</html>
