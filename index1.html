<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selené - AI Companion</title>
  <style>
    /* Global Styling */
    :root {
      --bg-deep: #0b0914;
      --card-bg: rgba(22, 17, 38, 0.75);
      --border-purple: #3d2b56;
      --theme-purple: #b78be9;
      --text-bright: #f0e6ff;
      --text-muted: #a393bf;
      --gold-glow: rgba(229, 195, 150, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-bright);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Main Companion Card Container */
    .companion-card {
      background: var(--card-bg);
      border: 1px solid var(--border-purple);
      border-radius: 16px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    /* Avatar Display Area */
    .avatar-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #151026;
      border: 1px solid var(--border-purple);
      margin-bottom: 16px;
    }

    .avatar-img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Gold Metallic SVS Emblem Overlay on Left Dress */
    .svs-dress-badge {
      position: absolute;
      top: 54%;              /* Positioned at dress chest height */
      left: 35%;             /* Positioned on Selené's left dress side */
      width: 46px;           /* Emblem scale */
      height: 46px;
      pointer-events: none;  /* Allows clicking through to underlying model */
      z-index: 10;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9));
      animation: emblemGlow 4s infinite ease-in-out;
    }

    .svs-dress-badge svg {
      width: 100%;
      height: 100%;
    }

    /* Subtle Metallic Shimmer Animation */
    @keyframes emblemGlow {
      0%, 100% {
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9)) brightness(1);
      }
      50% {
        filter: drop-shadow(0 0 10px var(--gold-glow)) brightness(1.25);
      }
    }

    /* Details Header */
    .companion-info h2 {
      color: var(--theme-purple);
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .companion-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="companion-card">
    <div class="avatar-wrapper">
      <!-- Placeholder Avatar Canvas/Image -->
  <img src="https://raw.githubusercontent.com/JasmineSV197/J.A.C.E.-001/main/selene.png" alt="Selené Vesperiine" class="avatar-img" />
      <!-- SVS Emblem Overlay -->
      <div class="svs-dress-badge" title="Official SVS Emblem">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
          <defs>
            <!-- Metallic Gold Bronze Gradient -->
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#E5C396"/>
              <stop offset="25%" stop-color="#9A6B3D"/>
              <stop offset="50%" stop-color="#F2E2C2"/>
              <stop offset="75%" stop-color="#805328"/>
              <stop offset="100%" stop-color="#C5A475"/>
            </linearGradient>

            <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
              <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.9"/>
            </filter>
          </defs>

          <g filter="url(#badgeShadow)">
            <!-- Outer Circular Rim -->
            <circle cx="250" cy="250" r="225" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>

            <!-- Outer Thin Frame Line -->
            <circle cx="250" cy="250" r="238" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>

            <!-- Left Crescent Moon Motif -->
            <path d="M 250 39 C 120 39, 45 140, 45 250 C 45 360, 120 461, 250 461 C 145 440, 95 350, 95 250 C 95 150, 145 60, 250 39 Z" fill="url(#goldGrad)"/>

            <!-- Intertwined Serif Monogram -->
            <!-- Main S -->
            <text x="240" y="240" font-family="'Times New Roman', serif" font-size="210" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">S</text>

            <!-- Center V -->
            <text x="250" y="360" font-family="'Times New Roman', serif" font-size="170" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">V</text>

            <!-- Interlocking Lower S -->
            <text x="325" y="420" font-family="'Times New Roman', serif" font-size="180" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">S</text>
          </g>
        </svg>
      </div>
    </div>

    <div class="companion-info">
      <h2>Selené Vesperiine</h2>
      <p>AI Companion • Identity & Specs Locked</p>
    </div>
  </div>

</body>
</html>
